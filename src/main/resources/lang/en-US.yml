cmd:
  denied: "§cYou may not use this command."
  failed: "§c[Region] Could not finish: ${0}"
  usage: "§e[Region] Wrong usage; see /region help."
done: "§a[Region] Done."
help:
  read: "§e/region list [page] §7— list regions; §e/region info [name] §7— show a region (default: under your feet)"
