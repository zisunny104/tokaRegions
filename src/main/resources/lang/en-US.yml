  edit: "§e/region del <name> [confirm], rename <name> <new>, settp <name>, mode <name> <open|protect|lock>, land <name> <buy|flat> <on|off>, land <name> offer <0-1>, tax <name> add <more than> <rate> [outsider rate], tax <name> clear"
  tag: "§e/region tag <name> [text|clear] §7- §bSet what the name tag shows for players affiliated with this region; & stands for colour codes"
  people: "§e/region affil <player> <region|none> §7— set affiliation; §e/region adjust <player> <rate> <reason> §7— personal tax adjustment; adjust <player> clear removes it"
list:
  header: "§b[Region] Page ${0}/${1}, ${2} total:"
  row: "§7${0} §8(${1} / ${2})"
info: "§bRegion: ${0}
World: ${1}; protection: ${2}
Land purchase: ${3}; flat pricing: ${4}; affiliation offer: ${5}; tax tiers: ${6}"
