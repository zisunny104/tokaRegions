language: zh-TW
storage:
  backend: SQLITE
  schema-version: 1
  directory: storage
treasury:
  # 區域帳戶使用的貨幣代碼（tokaEconomy 的 config）。
  currency: money
selection:
  # 管理員選區工具（Nukkit 物品名稱或 ID:damage），破壞方塊為第一點、點擊為第二點。
  tool: "294:0"
  # /region set ... full 使用的高度範圍。
  full-min-y: 0
  full-max-y: 255
  # /region set <名稱> world 的範圍：以原點為中心，往四方各幾格（現有的世界區域是 15000）。
  world-radius: 15000
# 戶籍：玩家可以登記的區域（寫區域名稱）。新玩家會由 tokaProfiles 從這裡隨機分到一個；留空就不自動分配。
household:
  villages: []
  # 玩家能不能自己用 /region household <區域> 改戶籍。false 時只有管理員能用 /region affil 改。
  player-change: false

protection:
  # 是否由本插件執行各區域的保護模式（open／protect／lock）。為 false 時待命。換手時由轉換工具在停用舊保護後自動改成 true。
  # protect：管理員，以及已有領地者可建造；領地內改由領地自己的規則決定。lock：任何人都不能動（包含管理員，靜默）。
  enforce: true
  # 不在任何區域內的地方怎麼處理，和區域的保護模式一樣：OPEN 不限制；PROTECT 管理員與有領地的人可以動；
  # LOCK 任何人都不能動（包含管理員，靜默），要動請先建區域。有 tokaLand 領地的地方一律交給領地規則。
  outside: LOCK
