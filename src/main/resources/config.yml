language: zh-TW
storage:
  backend: SQLITE
  schema-version: 1
  directory: storage
treasury:
  # 區域帳戶使用的貨幣代碼（tokaEconomy 的 config）。
  currency: money
selection:
  # 管理員選區工具（Nukkit 物品名稱或 ID:damage），破壞方塊為第一點、點擊為第二點。
  tool: "294:0"
  # /region set ... full 使用的高度範圍。
  full-min-y: 0
  full-max-y: 255
protection:
  # 是否由本插件執行各區域的保護模式（open／protect／lock）。待命＝false，確認 zero 的舊區域保護已停用後才改為 true。
  # protect：管理員，以及已有領地者可建造；領地內改由領地自己的規則決定。lock：只有管理員。
  enforce: false
